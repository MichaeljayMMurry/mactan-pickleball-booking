name = "mactan-pickleball-booking"
main = "worker.mjs"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
run_worker_first = ["/", "/staff", "/api/*", "/service-worker.js"]

[durable_objects]
bindings = [{ name = "CLUB", class_name = "ClubDatabase" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClubDatabase"]

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true
